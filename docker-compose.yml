services:
  api:
    build: .
    environment:
      CYBERGUARD_API_TOKEN: ${CYBERGUARD_API_TOKEN:?Set a strong API token}
      CYBERGUARD_DB: /app/data/cyberguard.sqlite3
      CYBERGUARD_MODEL_DIR: /app/models
      CYBERGUARD_ENV: production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
